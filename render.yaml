services:
  - type: web
    name: buki-connector-kit
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUKI_URL
        value: https://my-buki.onrender.com
      - key: BUKI_API_TOKEN
        generateValue: true
      - key: SKIP_TOKEN_PROMPT
        value: "true"
      - key: SAGE_MOCK_MODE
        value: "false"
      - key: SAGE_TIMEOUT_MS
        value: "3000"
      - key: BUKI_TIMEOUT_MS
        value: "15000"
      - key: MONGODB_URI
        sync: false
      - key: SAGE_API_URL
        sync: false
      - key: SAGE_API_KEY
        sync: false
